<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Contato</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #ffffff;
    color: #821496;
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

    header {
    background-color: #a119b9;
    color: #341a28;
    padding: 20px;
    text-align: center;
  }
   header h1 {
    margin: 0;
    font-size: 3em;
  }

  header p {
    margin: 5px 0 0;
    font-weight: 400;
  }
  ul {
    list-style: none;
    padding: 10px;
    margin: 60px 0;
    width: 420px;            /* tabela maior */
    background: #5a1166;
    border-radius: 20px;
    box-shadow: 0 10px 20px rgba(51, 16, 45, 0.7);
  }

  li {
    padding: 22px 25px;      /* mais espaço interno */
    margin: 12px;
    border-radius: 15px;
    cursor: pointer;
    font-size: 20px;         /* texto maior */
    background: #ffffff;
    transition: filter 0.3s ease, transform 0.2s ease;
  }

  li:hover {
    filter: brightness(1.15);
    transform: scale(1.02);
  }

  .titulo {
    font-weight: bold;
    font-size: 22px;
  }

  .info {
    font-size: 1rem;
    color: #5a1166;
    margin-top: 6px;
  }

  footer {
    margin-top: auto;
    width: 100%;
    background-color: #ffffff;
    color: #a119b9;
    text-align: center;
    padding: 60px 0;
    font-size: 14px;
  }
</style>
</head>

<body>

  <header>
     <h1>Contato</h1>
    <p>formas de contactar-nos</p>
  </header>
<ul>
  <li>
    <span class="titulo">Facebook</span>
    <span class="info">@Nextpageofc</span>
  </li>

  <li>
    <span class="titulo">Twitter</span>
    <span class="info">@nextpageofc</span>
  </li>

  <li>
    <span class="titulo">Whatsapp</span>
    <span class="info">+351 927 492 190</span>
  </li>

  <li>
    <span class="titulo">Instagram</span>
    <span class="info">@nextpageofc</span>
  </li>
</ul>

<footer>
  <p>&copy; 2026 - NextPage | Todos os direitos reservados.</p>
</footer>

</body>
</html>
